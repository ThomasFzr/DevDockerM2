services:
  api:
    image: ${API_IMAGE:-td4-api}
    ports:
      - "${API_PORT:-8000}:3000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    mem_limit: 256m
    environment:
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password

  db:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password

  cache:
    restart: unless-stopped

secrets:
  db_password:
    file: ./secrets/db_password.txt
